# The phase-1 spike: pushes an OCI 1.1 docs bundle to GHCR, signs it from a
# reusable workflow, and verifies it with sigstore-go and cosign. Runs on a
# push to a spike/** branch only; the owner deletes the package and branch
# once the findings are recorded.
name: Spike

on:
  push:
    branches: ["spike/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REPOSITORY: ghcr.io/open-platform-model/docs/spike
  SOURCE: https://github.com/open-platform-model/docs-kit

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tagged: ${{ steps.push.outputs.tagged }}
      untagged: ${{ steps.push.outputs.untagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Push, tag, list and fetch
        id: push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./hack/spike push --repository "$REPOSITORY" --source "$SOURCE"

  sign-tagged:
    needs: push
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/spike-sign.yml
    with:
      digest: ${{ needs.push.outputs.tagged }}

  sign-untagged:
    needs: push
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/spike-sign.yml
    with:
      digest: ${{ needs.push.outputs.untagged }}

  verify:
    needs: [push, sign-tagged, sign-untagged]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAGGED: ${{ needs.push.outputs.tagged }}
      UNTAGGED: ${{ needs.push.outputs.untagged }}
      SAN: https://github.com/open-platform-model/docs-kit/.github/workflows/spike-sign.yml@${{ github.ref }}
      CALLER_SAN: https://github.com/open-platform-model/docs-kit/.github/workflows/spike.yml@${{ github.ref }}
      REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build the spike
        run: go build -o spike ./hack/spike

      - name: List tags after signing
        run: ./spike tags --repository "$REPOSITORY"

      - name: sigstore-go verifies the tagged digest
        run: ./spike verify --repository "$REPOSITORY" --digest "$TAGGED" --san "$SAN" --repo "$SOURCE" --ref "$REF"

      - name: sigstore-go verifies the untagged digest
        run: ./spike verify --repository "$REPOSITORY" --digest "$UNTAGGED" --san "$SAN" --repo "$SOURCE" --ref "$REF"

      - name: cosign verifies the tagged digest
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          cosign verify "${REPOSITORY}@${TAGGED}" \
            --new-bundle-format=true \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$SAN" \
            --certificate-github-workflow-repository open-platform-model/docs-kit \
            --certificate-github-workflow-ref "$REF"

      - name: sigstore-go refuses another source repository
        run: |
          if ./spike verify --repository "$REPOSITORY" --digest "$TAGGED" --san "$SAN" \
               --repo https://github.com/open-platform-model/cli --ref "$REF"; then
            echo "::error::verification passed with the wrong source repository"; exit 1
          fi
          echo "refused, as it must"

      - name: sigstore-go refuses the caller as SAN
        run: |
          if ./spike verify --repository "$REPOSITORY" --digest "$TAGGED" --san "$CALLER_SAN" \
               --repo "$SOURCE" --ref "$REF"; then
            echo "::error::verification passed with the calling workflow as SAN"; exit 1
          fi
          echo "refused, as it must"

      - name: Anonymous resolve (expected to fail while the package is private)
        continue-on-error: true
        run: ./spike pull --repository "$REPOSITORY" --tag 0.0 --san "$SAN" --repo "$SOURCE" --ref "$REF"
