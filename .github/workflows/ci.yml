# docs-kit's own gate: task check (fmt:check, vet, lint, openspec:check,
# test) and actionlint over every workflow. publish.yml installs a released
# opm-docs, so it is not run here; the prerelease dry run in a caller is its
# end-to-end check.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: task check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # task check also tests, vets and lints the nested cobradump module.
          cache-dependency-path: |
            go.sum
            cobradump/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3
          install-only: true
      - name: Install openspec
        run: npm install -g @fission-ai/openspec@1.12.0
      - name: task check
        run: task check

  # The cue-definitions renderer against core's refgen pages, at the core
  # commit the parity was measured at (docs/contracts.md C17); pinned so it
  # stays checkable after core retires refgen.
  core-definitions-parity:
    name: core definitions parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: open-platform-model/core
          ref: c5a6076bdb46c0b637606255b61bec84f4a3a9e5
          path: .core
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: TestCoreDefinitionsParity
        env:
          OPM_CORE_CHECKOUT: ${{ github.workspace }}/.core
        run: go test -count=1 -run '^TestCoreDefinitionsParity$' -v ./internal/render/

  # opm-docs serve against a real Hugo: the version and checksum opmodel.dev
  # pins in site/Dockerfile, so the preview runs on the Hugo the site builds
  # with. task check skips these tests without hugo on PATH; here a missing
  # hugo fails them, and the grep proves each one ran rather than skipped.
  serve-hugo:
    name: serve with hugo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.167.0
      HUGO_SHA256: 4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Hugo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.tgz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/hugo.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tgz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: TestServeWithHugo and TestServeSignals
        env:
          OPM_DOCS_REQUIRE_HUGO: "1"
        run: |
          go test -count=1 -race -run '^(TestServeWithHugo|TestServeSignals)$' -v ./internal/serve/ ./cmd/opm-docs/ | tee "$RUNNER_TEMP/serve.log"
          grep -q -- '--- PASS: TestServeWithHugo' "$RUNNER_TEMP/serve.log"
          grep -q -- '--- PASS: TestServeSignals' "$RUNNER_TEMP/serve.log"

  # The markup check (internal/mdsafe, docs/contracts.md C21) against the
  # Hugo opmodel.dev pins: every review probe that this Hugo renders as live
  # markup must be refused. task check skips the test without hugo on PATH;
  # here a missing hugo fails it, and the grep proves it ran.
  markup-hugo:
    name: markup check with hugo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.167.0
      HUGO_SHA256: 4d84519b9f619e6d4c3fb45a50157abeabeb724f859c60605f44c23def6e1169
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Hugo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.tgz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/hugo.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/hugo.tgz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: TestProbesWithHugo
        env:
          OPM_DOCS_REQUIRE_HUGO: "1"
        run: |
          go test -count=1 -run '^TestProbesWithHugo$' -v ./internal/mdsafe/ | tee "$RUNNER_TEMP/markup.log"
          grep -q -- '--- PASS: TestProbesWithHugo' "$RUNNER_TEMP/markup.log"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: actionlint
        run: actionlint
