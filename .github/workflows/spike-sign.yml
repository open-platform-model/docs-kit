# Signs one digest of the spike package with cosign keyless. It stands in for
# publish.yml: a reusable workflow called by another workflow, so the
# certificate's SAN names this file while the Source Repository URI names the
# caller's repository, the identity split the bundle signing policy relies on.
name: Spike sign

on:
  workflow_call:
    inputs:
      digest:
        description: The manifest digest to sign (sha256:...)
        type: string
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin

      - name: Sign
        env:
          DIGEST: ${{ inputs.digest }}
        run: cosign sign --yes --new-bundle-format=true "ghcr.io/open-platform-model/docs/spike@${DIGEST}"
