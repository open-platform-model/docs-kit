name: Cite lint

# The comment rule of the enhancements store, run by the reusable workflow of
# open-platform-model/.github. The tool commit is that workflow's own pin.
# `task cite-lint` runs the same tool with the same excludes; change both
# lists together. Each excluded path reads or tests the old citation forms on
# purpose (docs revisions build old release tags) and is never rewritten.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  cite-lint:
    name: Cite lint
    permissions:
      contents: read
    uses: open-platform-model/.github/.github/workflows/cite-lint.yml@2b66da51fede4332969c324b069012632d8edea9 # .github main
    with:
      paths: .
      exclude: |
        internal/doctext/doctext_test.go
        internal/doctext/policy_test.go
        internal/build/enhancements_test.go
        internal/extract/enhancements/extract_test.go
        internal/pull/sections_test.go
        internal/extract/enhancements/extract.go
        internal/extract/enhancements/model.go
        internal/render/testdata/library/
        internal/extract/cuecatalog/testdata/catalog/demo/
        internal/extract/cuedefs/testdata/defs/src/
        internal/extract/goapi/testdata/mod/lib/
