# The reusable docs bundle workflow. A repository calls it pinned to a
# docs-kit release tag (publish.yml@vX.Y.Z), never a branch or a SHA: the
# signing certificate names this file at that ref, and opm-docs pull trusts
# only refs/tags/v[0-9]* (docs/contracts.md C5, C9). docs-kit's tags are
# immutable (org rulesets), which is what makes a tag pin safe.
#
# The opm-docs release it runs is the caller's: the one tag line of the
# caller's .opm-docs-version (v0.1.0), downloaded and checked against that
# release's checksums.txt. A caller moves .opm-docs-version and the
# publish.yml@ ref together, in one PR (docs/contracts.md C5, C12).
#
# Modes:
#   check    pull_request: build and lint into a temporary directory; writes nothing.
#   edge     push to main: build the commit, push by digest, sign, move edge.
#   release  the release-please job of a release (or a workflow_dispatch backfill):
#            build the tag at src/, push <version>.0, sign, move the moving tags.
#
# The caller's job grants the permissions (this file declares none, so a
# check-only caller needs no write grant):
#   check            contents: read, packages: read
#   edge, release    contents: read, packages: write, id-token: write
name: Publish docs

on:
  workflow_call:
    inputs:
      project:
        description: The project, a key under `bundles` in the caller's docs-kit.cue
        type: string
        required: true
      mode:
        description: "check | edge | release"
        type: string
        required: true
      tag:
        description: release mode, the release's git tag (opm-v4.4.5)
        type: string
        default: ""
      cue-registry:
        description: CUE_REGISTRY for the extractors
        type: string
        default: "opmodel.dev=ghcr.io/open-platform-model,registry.cue.works"
    outputs:
      digest:
        description: The pushed manifest digest (empty in check mode)
        value: ${{ jobs.docs.outputs.digest }}
      tag:
        description: The full tag written (empty in check and edge modes)
        value: ${{ jobs.docs.outputs.tag }}

env:
  CUE_REGISTRY: ${{ inputs.cue-registry }}
  PROJECT: ${{ inputs.project }}
  MODE: ${{ inputs.mode }}

jobs:
  # One job for every mode, so the install, login and publish steps are
  # written once. Its concurrency group depends on the mode: edge runs share
  # one group and cancel each other (only the newest main matters); a
  # release has its own group per tag that nothing cancels; a check is
  # alone in its run's group.
  docs:
    name: Docs ${{ inputs.mode }} (${{ inputs.project }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ inputs.mode == 'edge' && format('docs-edge-{0}', inputs.project) || inputs.mode == 'release' && format('docs-release-{0}-{1}', inputs.project, inputs.tag) || format('docs-check-{0}-{1}', inputs.project, github.run_id) }}
      cancel-in-progress: ${{ inputs.mode == 'edge' }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - name: Refuse an unknown mode or a publish outside main
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          case "$MODE" in
            check) exit 0 ;;
            edge|release) ;;
            *) echo "::error::mode \"$MODE\" is not one of check, edge, release"; exit 1 ;;
          esac
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::mode $MODE runs only on refs/heads/main, not $REF: bundles publish from main, never from a release branch"
            exit 1
          fi
          if [ "$MODE" = release ] && [ -z "$TAG" ]; then
            echo "::error::mode release needs the input tag, the release's git tag (opm-v4.4.5)"
            exit 1
          fi

      # The commit the caller ran on: the pull request's head for check,
      # the pushed commit of main otherwise. In release mode it supplies
      # .opm-docs-version, and docs-kit.cue when the release tree has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Release mode: every source resolves against the release tree at src/.
      - if: inputs.mode == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          fetch-depth: 0

      - name: Install the opm-docs release .opm-docs-version names
        run: |
          set -euo pipefail
          if [ ! -f .opm-docs-version ]; then
            echo "::error::no .opm-docs-version at the repository root: write the docs-kit release tag (v0.1.0) on one line, the same release as the publish.yml@ ref"
            exit 1
          fi
          tag=$(cat .opm-docs-version)
          if [ "$(wc -l < .opm-docs-version)" -gt 1 ] || ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::.opm-docs-version must hold one docs-kit release tag such as v0.1.0, not \"$tag\""
            exit 1
          fi
          version=${tag#v}
          archive="opm-docs_${version}_linux_amd64.tar.gz"
          base="https://github.com/open-platform-model/docs-kit/releases/download/${tag}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          grep -q " ${archive}\$" checksums.txt || { echo "::error::checksums.txt of ${tag} has no line for $archive"; exit 1; }
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin opm-docs
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: opm-docs check
        if: inputs.mode == 'check'
        run: opm-docs check --project "$PROJECT"

      - name: Build edge
        if: inputs.mode == 'edge'
        run: opm-docs build --edge --project "$PROJECT"

      - name: Build the release
        if: inputs.mode == 'release'
        env:
          TAG: ${{ inputs.tag }}
        run: opm-docs build --release "$TAG" --source src --project "$PROJECT"

      - name: Push
        id: push
        if: inputs.mode != 'check'
        run: |
          set -euo pipefail
          opm-docs push --dir "out/$PROJECT" | tee "$RUNNER_TEMP/push.json"
          echo "digest=$(jq -r .digest "$RUNNER_TEMP/push.json")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag "$RUNNER_TEMP/push.json")" >> "$GITHUB_OUTPUT"

      - if: inputs.mode != 'check'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Sign the digest, never a tag; promote moves no tag to an unsigned
      # digest.
      - name: Sign the digest
        if: inputs.mode != 'check'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --new-bundle-format=true "ghcr.io/open-platform-model/docs/${PROJECT}@${DIGEST}"

      - name: Promote
        if: inputs.mode != 'check'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: opm-docs promote --project "$PROJECT" --digest "$DIGEST"
