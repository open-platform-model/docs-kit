# The reusable docs bundle workflow. A repository calls it pinned to a
# docs-kit release tag (publish.yml@vX.Y.Z), never a branch or a SHA: the
# signing certificate names this file at that ref, and opm-docs pull trusts
# only refs/tags/v[0-9]* (docs/contracts.md C5, C9). docs-kit's tags are
# immutable (org rulesets), which is what makes a tag pin safe.
#
# The opm-docs release it runs is the caller's: the one tag line of the
# caller's .opm-docs-version (v0.1.0), downloaded and checked against that
# release's checksums.txt. A caller moves .opm-docs-version and the
# publish.yml@ ref together, in one PR (docs/contracts.md C5, C12).
#
# Modes:
#   check    pull_request: build and lint into a temporary directory; writes nothing.
#   edge     push to main: build the commit, push by digest, sign, move edge.
#   release  the release-please job of a release (or a workflow_dispatch backfill):
#            build the tag at src/, push <version>.0, sign, move the moving tags.
#   revision workflow_dispatch: apply a documentation fix on main (input fix) to a
#            published release (input tag), build <version>.<next>, push, sign,
#            move the moving tags.
#
# Two jobs. build checks out the caller and runs opm-docs check, build or
# revise, which may run the caller's own code (repository commands,
# docs-kit C14); it declares contents: read and packages: read, so it can
# never request an OIDC token. publish takes the bundle tree from a workflow
# artifact, checks out nothing of the caller, and pushes, signs and promotes.
#
# The caller's job grants the permissions (publish declares none, so a
# check-only caller needs no write grant):
#   check                      contents: read, packages: read
#   edge, release, revision    contents: read, packages: write, id-token: write
name: Publish docs

on:
  workflow_call:
    inputs:
      project:
        description: The project, a key under `bundles` in the caller's docs-kit.cue
        type: string
        required: true
      mode:
        description: "check | edge | release | revision"
        type: string
        required: true
      tag:
        description: release and revision modes, the release's git tag (opm-v4.4.5)
        type: string
        default: ""
      fix:
        description: revision mode, the 40-hex commit on main whose documentation change to apply
        type: string
        default: ""
      cue-registry:
        description: CUE_REGISTRY for the extractors
        type: string
        default: "opmodel.dev=ghcr.io/open-platform-model,registry.cue.works"
      setup-go:
        description: Install Go (actions/setup-go, pinned by SHA) from the source tree's go.mod, for repository commands that run Go (docs-kit C14)
        type: boolean
        default: false
    outputs:
      digest:
        description: The pushed manifest digest (empty in check mode)
        value: ${{ jobs.publish.outputs.digest }}
      tag:
        description: The full tag written (empty in check and edge modes)
        value: ${{ jobs.publish.outputs.tag }}

env:
  CUE_REGISTRY: ${{ inputs.cue-registry }}
  PROJECT: ${{ inputs.project }}
  MODE: ${{ inputs.mode }}

# The concurrency group covers both jobs of a run, and depends on the mode:
# edge runs share one group and cancel each other (only the newest main
# matters); a release and its revisions share one group per tag that
# nothing cancels, so two revisions never build at once and never pick the
# same revision number; a check is alone in its run's group.
concurrency:
  group: ${{ inputs.mode == 'edge' && format('docs-edge-{0}', inputs.project) || (inputs.mode == 'release' || inputs.mode == 'revision') && format('docs-release-{0}-{1}', inputs.project, inputs.tag) || format('docs-check-{0}-{1}', inputs.project, github.run_id) }}
  cancel-in-progress: ${{ inputs.mode == 'edge' }}

jobs:
  build:
    name: Docs ${{ inputs.mode }} build (${{ inputs.project }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      opm-docs: ${{ steps.install.outputs.tag }}
    steps:
      - name: Refuse an unknown mode or a publish outside main
        env:
          TAG: ${{ inputs.tag }}
          FIX: ${{ inputs.fix }}
          REF: ${{ github.ref }}
        run: |
          case "$MODE" in
            check) exit 0 ;;
            edge|release|revision) ;;
            *) echo "::error::mode \"$MODE\" is not one of check, edge, release, revision"; exit 1 ;;
          esac
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::mode $MODE runs only on refs/heads/main, not $REF: bundles publish from main, never from a release branch"
            exit 1
          fi
          if { [ "$MODE" = release ] || [ "$MODE" = revision ]; } && [ -z "$TAG" ]; then
            echo "::error::mode $MODE needs the input tag, the release's git tag (opm-v4.4.5)"
            exit 1
          fi
          if [ "$MODE" = revision ] && ! printf '%s\n' "$FIX" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::mode revision needs the input fix, the full 40-hex commit on main whose documentation change to apply, not \"$FIX\""
            exit 1
          fi

      # The commit the caller ran on: the pull request's head for check,
      # the pushed commit of main otherwise. In release mode it supplies
      # .opm-docs-version, and docs-kit.cue when the release tree has none.
      # Full history brings origin/main and the tags, which revision mode
      # reads: the fix must be on main, and the release tree is the tag's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Release mode: every source resolves against the release tree at src/.
      - if: inputs.mode == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          fetch-depth: 0

      - name: Install the opm-docs release .opm-docs-version names
        id: install
        run: |
          set -euo pipefail
          if [ ! -f .opm-docs-version ]; then
            echo "::error::no .opm-docs-version at the repository root: write the docs-kit release tag (v0.1.0) on one line, the same release as the publish.yml@ ref"
            exit 1
          fi
          tag=$(cat .opm-docs-version)
          if [ "$(wc -l < .opm-docs-version)" -gt 1 ] || ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::.opm-docs-version must hold one docs-kit release tag such as v0.1.0, not \"$tag\""
            exit 1
          fi
          version=${tag#v}
          archive="opm-docs_${version}_linux_amd64.tar.gz"
          base="https://github.com/open-platform-model/docs-kit/releases/download/${tag}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          grep -q " ${archive}\$" checksums.txt || { echo "::error::checksums.txt of ${tag} has no line for $archive"; exit 1; }
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin opm-docs
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - if: inputs.setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.mode == 'release' && 'src/go.mod' || 'go.mod' }}

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: opm-docs check
        if: inputs.mode == 'check'
        run: opm-docs check --project "$PROJECT"

      - name: Build edge
        if: inputs.mode == 'edge'
        run: opm-docs build --edge --project "$PROJECT"

      - name: Build the release
        if: inputs.mode == 'release'
        env:
          TAG: ${{ inputs.tag }}
        run: opm-docs build --release "$TAG" --source src --project "$PROJECT"

      # The release tree with the fixes applied, in a temporary worktree;
      # revise refuses anything but a documentation change.
      - name: Build the revision
        if: inputs.mode == 'revision'
        env:
          TAG: ${{ inputs.tag }}
          FIX: ${{ inputs.fix }}
        run: opm-docs revise --project "$PROJECT" --tag "$TAG" --fix "$FIX"

      # The bundle tree goes to the publish job; content/ and data/ are
      # recreated there, since an artifact drops an empty directory.
      - name: Hand the bundle to the publish job
        if: inputs.mode != 'check'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-bundle-${{ inputs.project }}-${{ github.run_id }}
          path: out/${{ inputs.project }}/
          if-no-files-found: error
          retention-days: 1

  # Runs no code of the caller: no checkout, only the opm-docs release the
  # build job installed, the bundle tree it built, and cosign. It declares
  # no permissions and inherits the caller's packages: write and
  # id-token: write.
  publish:
    name: Docs ${{ inputs.mode }} publish (${{ inputs.project }})
    needs: build
    if: inputs.mode != 'check'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - name: Install opm-docs
        env:
          TAG: ${{ needs.build.outputs.opm-docs }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          archive="opm-docs_${version}_linux_amd64.tar.gz"
          base="https://github.com/open-platform-model/docs-kit/releases/download/${TAG}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          grep -q " ${archive}\$" checksums.txt || { echo "::error::checksums.txt of ${TAG} has no line for $archive"; exit 1; }
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin opm-docs
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-bundle-${{ inputs.project }}-${{ github.run_id }}
          path: out/${{ inputs.project }}

      - name: Restore the bundle's empty directories
        run: mkdir -p "out/$PROJECT/content" "out/$PROJECT/data"

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Push
        id: push
        run: |
          set -euo pipefail
          opm-docs push --dir "out/$PROJECT" | tee "$RUNNER_TEMP/push.json"
          echo "digest=$(jq -r .digest "$RUNNER_TEMP/push.json")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag "$RUNNER_TEMP/push.json")" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Sign the digest, never a tag; promote moves no tag to an unsigned
      # digest.
      - name: Sign the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes --new-bundle-format=true "ghcr.io/open-platform-model/docs/${PROJECT}@${DIGEST}"

      - name: Promote
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: opm-docs promote --project "$PROJECT" --digest "$DIGEST"
