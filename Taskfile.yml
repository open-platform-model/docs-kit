version: "3"

# Silent by default - set TASK_VERBOSE=1 or use --verbose to show commands
silent: true

vars:
  BINARY_NAME: opm-docs
  BUILD_DIR: bin
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || echo "0.0.0-dev"
  LDFLAGS: -X github.com/open-platform-model/docs-kit/internal/version.Version={{.VERSION}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build ./bin/opm-docs with the version stamped in
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} ./cmd/opm-docs

  fmt:
    desc: Format Go code (gofmt and goimports)
    cmds:
      - go fmt ./...
      - go -C cobradump fmt ./...
      - goimports -w .

  fmt:check:
    desc: Fail when a Go file is not gofmt-formatted; writes nothing
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then echo "not gofmt-formatted:"; echo "$out"; exit 1; fi

  vet:
    desc: Run go vet (both modules)
    cmds:
      - go vet ./...
      - go -C cobradump vet ./...

  lint:
    desc: Run golangci-lint (both modules)
    cmds:
      - golangci-lint run ./...
      - task: lint:cobradump

  lint:cobradump:
    desc: Run golangci-lint in the nested cobradump module (finds ../.golangci.yml)
    dir: cobradump
    cmds:
      - echo "golangci-lint cobradump/"
      - golangci-lint run ./...

  tidy:
    desc: Tidy both Go modules
    cmds:
      - go mod tidy
      - go -C cobradump mod tidy

  test:
    desc: Run every Go test, both modules (offline; no registry, no cluster)
    cmds:
      - go test ./...
      - go -C cobradump test ./...

  openspec:install:
    desc: Install the openspec CLI at the version CI pins
    cmds:
      - npm install -g @fission-ai/openspec@1.14.1

  openspec:check:
    desc: Validate every main spec and active change with --strict
    preconditions:
      - sh: command -v openspec >/dev/null
        msg: "openspec not found: run `task openspec:install` (needs npm)"
    cmds:
      - openspec validate --all --strict --no-interactive

  cite-lint:
    desc: Check Go and CUE files against the comment rule (no decision number, no lone enhancement id, no old entry path), as CI does
    vars:
      # The one pinned commit of enhancements that every repo's CI uses: the
      # enh-ref default of the reusable cite-lint.yml in open-platform-model/.github.
      # Move it only with the .github pin.
      ENH_REF: e0335b2ec44e659c0191bc3523d79d17f26f8e7d
    cmds:
      # The excludes are repeated in .github/workflows/cite-lint.yml (a reusable
      # workflow input cannot read this file); change both together.
      # These files and folders read or test the old citation forms on purpose
      # (docs revisions build old release tags); they are never rewritten.
      - >-
        go run github.com/open-platform-model/enhancements/tools/enh@{{.ENH_REF}}
        cite-lint --root {{.ROOT_DIR}}
        --exclude internal/doctext/doctext_test.go
        --exclude internal/doctext/policy_test.go
        --exclude internal/build/enhancements_test.go
        --exclude internal/extract/enhancements/extract_test.go
        --exclude internal/pull/sections_test.go
        --exclude internal/extract/enhancements/extract.go
        --exclude internal/extract/enhancements/model.go
        --exclude internal/render/testdata/library/
        --exclude internal/extract/cuecatalog/testdata/catalog/demo/
        --exclude internal/extract/cuedefs/testdata/defs/src/
        --exclude internal/extract/goapi/testdata/mod/lib/

  check:
    desc: Run every gate (fmt:check, vet, lint, openspec:check, test)
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: openspec:check
      - task: test

  clean:
    desc: Remove build output
    cmds:
      - rm -rf {{.BUILD_DIR}} out
