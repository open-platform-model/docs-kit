<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ .Title }} | opm-docs preview</title>
<style>
:root { --fg: #1b1b1f; --bg: #fff; --muted: #5c5c66; --line: #d9d9e0; --box: #f4f4f7; }
@media (prefers-color-scheme: dark) { :root { --fg: #e8e8ec; --bg: #16161a; --muted: #a0a0ab; --line: #34343c; --box: #202026; } }
body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
header { padding: .6rem 1rem; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
.wrap { display: flex; gap: 2rem; padding: 1rem; max-width: 72rem; margin: 0 auto; }
nav { flex: 0 0 14rem; font-size: .9rem; }
nav a { display: block; padding: .15rem 0; }
main { flex: 1; min-width: 0; }
pre { overflow-x: auto; padding: .75rem; background: var(--box); }
table { border-collapse: collapse; } td, th { border: 1px solid var(--line); padding: .25rem .5rem; }
.description { color: var(--muted); }
.alert, .figure { border: 1px solid var(--line); border-left-width: 4px; padding: .25rem 1rem; margin: 1rem 0; background: var(--box); }
.figure { border-style: dashed; color: var(--muted); }
@media (max-width: 40rem) { .wrap { flex-direction: column; } nav { flex-basis: auto; } }
</style>
</head>
<body>
<header><a href="/">opm-docs preview</a>: page content only, not the site's design</header>
<div class="wrap">
<nav>
{{- with .CurrentSection }}
<a href="{{ .RelPermalink }}"><strong>{{ .Title }}</strong></a>
{{- range .Pages.ByWeight }}
<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
{{- end }}
{{- end }}
</nav>
<main>
<h1>{{ .Title }}</h1>
{{- with .Description }}
<p class="description">{{ . }}</p>
{{- end }}
{{ block "main" . }}{{ end }}
</main>
</div>
</body>
</html>
